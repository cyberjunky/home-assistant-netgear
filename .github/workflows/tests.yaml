name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Lint
        run: uvx ruff@0.17.4 check custom_components tests && uvx ruff@0.17.4 format --check custom_components tests

      - name: Tests
        run: |
          uv venv --python 3.14
          uv pip install -r requirements_test.txt
          uv run pytest -q
